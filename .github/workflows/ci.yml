name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    # Технологи работают в Windows, а CI по умолчанию живёт в Linux — проверяем оба.
    # В Linux без дисплея тест окна пропускается, в Windows он выполняется.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
